name: Trendex Automated News Crawler

on:
  schedule:
    # يعمل أوتوماتيكياً كل 6 ساعات (عند الدقيقة 0 من الساعات 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Execute News Fetcher Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python index.py

      - name: Commit and Push Updated news_data.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update news_data.json via GitHub Actions [skip ci]"
          file_pattern: "news_data.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
